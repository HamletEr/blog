[project]
name = "blog"
version = "0.1.0"
requires-python = "==3.12.12"
dependencies = [
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "dynaconf==3.3.2",
    "fastapi[standard]==0.138.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "migrations"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["blog_app"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = ["src/blog_app/"]
exclude = "src/test/*"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/blog_app/"]
omit = [
    "*/__init__.py",
]
