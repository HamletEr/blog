services:
  blog_app:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BLOG_APP_DATABASE__HOST: blog_app_db
      BLOG_APP_REDIS__HOST: blog_app_redis
    depends_on:
      blog_app_db:
        condition: service_healthy
      blog_app_redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS --max-time 2 http://localhost:8000/api/v1/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  blog_app_db:
    image: postgres:18-bookworm
    ports:
      - "${BLOG_APP_DATABASE__PORT}:5432"
    environment:
      POSTGRES_DB: ${BLOG_APP_DATABASE__NAME}
      POSTGRES_USER: ${BLOG_APP_DATABASE__USER}
      POSTGRES_PASSWORD: ${BLOG_APP_DATABASE__PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BLOG_APP_DATABASE__USER} -d ${BLOG_APP_DATABASE__NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  blog_app_redis:
    image: redis:8-bookworm
    ports:
      - "${BLOG_APP_REDIS__PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
